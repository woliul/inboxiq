<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Dashboard</title>
</head>
<body>
    <h1>My Email Dashboard</h1>
    <form action="/" method="get">
        <input type="text" name="search" placeholder="Search emails...">
        <button type="submit">Search</button>
    </form>
    <hr>
    <ul>
        {% for email in emails %}
        <li>
            <strong><a href="/email/{{ email.id }}">{{ email.subject }}</a></strong>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
